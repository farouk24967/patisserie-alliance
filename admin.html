<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gestion des produits — Alliance</title>
<style>
:root{--rose:#b5126f;--nuit:#2b0a1f;--creme:#fff7f1}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,sans-serif;background:var(--creme);color:var(--nuit)}
[hidden]{display:none!important}
header{background:var(--nuit);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header a{color:#fff}header div{display:flex;gap:14px;align-items:center}
main{max-width:1000px;margin:auto;padding:16px;display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.box{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #2b0a1f14}
h1{font-size:18px}h2{font-size:18px;color:var(--rose);margin-bottom:10px}
label{display:block;font-weight:600;font-size:13px;margin-top:12px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d9c8d2;border-radius:10px;margin-top:4px;background:#fff;color:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}
button{font:600 14px system-ui,sans-serif;border:0;border-radius:30px;padding:11px 18px;background:var(--rose);color:#fff;cursor:pointer}
button.s{background:#f1e4ec;color:var(--nuit);padding:8px 14px}button:disabled{opacity:.5}
.actions{display:flex;gap:10px;margin-top:16px}
#preview{max-width:100%;max-height:200px;border-radius:12px;margin-top:10px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.item img,.noimg{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#f1e4ec}
.item .t{flex:1;min-width:150px;overflow-wrap:anywhere}.item small{display:block;color:#755f6d}
#msg{position:fixed;bottom:16px;left:16px;right:16px;max-width:500px;margin:auto;padding:12px 16px;border-radius:12px;background:var(--nuit);color:#fff;text-align:center}
#demo{background:#ffe9b8;padding:10px 16px;text-align:center}
#login{max-width:380px;margin:40px auto}
#login form button{margin-top:16px;width:100%}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Pâtisserie Alliance · Mes produits</h1><div><a href="index.html">Voir le site</a><button class="s" id="out" hidden>Déconnexion</button></div></header>
<p id="demo" hidden><b>Mode essai :</b> les produits restent sur cet appareil. Les clients ne les voient pas encore.</p>
<section id="login" class="box" hidden><h2>Connexion</h2>
<form id="lf"><label>E-mail<input type="email" id="email" autocomplete="username" required></label>
<label>Mot de passe<input type="password" id="pass" autocomplete="current-password" required></label>
<button>Se connecter</button></form></section>
<main id="app" hidden>
<form id="f" class="box"><h2 id="ft">Ajouter un produit</h2>
<label>Photo<input type="file" id="photo" accept="image/*"></label><img id="preview" alt="Aperçu" hidden>
<label>Nom du produit *<input id="nom" required maxlength="80"></label>
<label>Catégorie<input id="categorie" list="cats" maxlength="40" placeholder="Ex. Gâteaux"></label>
<datalist id="cats"><option>Gâteaux</option><option>Gâteaux traditionnels</option><option>Tartes</option><option>Viennoiseries</option><option>Gâteaux de fête</option></datalist>
<div class="row"><label>Prix (DA)<input type="number" id="prix" min="0" step="1" inputmode="numeric"></label>
<label>Vendu<select id="unite"><option value="la pièce">à la pièce</option><option value="le kg">au kilo</option><option value="la boîte">à la boîte</option><option value="la part">à la part</option></select></label></div>
<label>Description<textarea id="description" rows="3" maxlength="600"></textarea></label>
<label>Ingrédients / allergènes<textarea id="ingredients" rows="2" maxlength="400"></textarea></label>
<label class="check"><input type="checkbox" id="disponible" checked> Disponible</label>
<label class="check"><input type="checkbox" id="visible" checked> Visible sur le site</label>
<div class="actions"><button id="ok">Enregistrer</button><button type="button" class="s" id="cancel" hidden>Annuler</button></div></form>
<section class="box"><h2 id="count">Produits</h2><input id="q" type="search" placeholder="Rechercher un produit" aria-label="Rechercher"><div id="list"></div></section>
</main>
<div id="msg" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="store.js"></script>
<script>
const $ = id => document.getElementById(id);
const TEXT = ['nom','categorie','unite','description','ingredients'];
let items = [], current = null, timer, blob;
function say(t){ $('msg').textContent=t; $('msg').hidden=false; clearTimeout(timer); timer=setTimeout(()=>$('msg').hidden=true,5000); }
function el(tag, props, ...kids){ const e=Object.assign(document.createElement(tag),props); e.append(...kids); return e; }
function preview(src){ $('preview').hidden=!src; if(src) $('preview').src=src; }
function reset(){ current=null; $('f').reset(); preview(); $('ft').textContent='Ajouter un produit'; $('cancel').hidden=true; }
function edit(p){
  reset(); current=p; TEXT.forEach(k=>{ if(p[k]!=null) $(k).value=p[k]; });
  $('prix').value=p.prix??''; $('disponible').checked=p.disponible; $('visible').checked=p.visible; preview(p.photo_url);
  $('ft').textContent='Modifier le produit'; $('cancel').hidden=false; $('f').scrollIntoView({behavior:'smooth'});
}
async function del(p){
  if(!confirm('Supprimer « '+p.nom+' » ?')) return;
  try{ await Store.remove(p); if(current&&current.id===p.id) reset(); await load(); say('Produit supprimé.'); }catch(e){ say(e.message); }
}
function render(){
  const q=$('q').value.toLowerCase();
  const shown=items.filter(p=>(p.nom+' '+(p.categorie||'')).toLowerCase().includes(q));
  $('count').textContent='Produits ('+items.length+')';
  $('list').replaceChildren(...shown.map(p=>{
    const info=[p.categorie, p.prix!=null?p.prix+' DA '+p.unite:'', p.disponible?'':'Épuisé', p.visible?'':'Masqué'].filter(Boolean).join(' · ');
    const b1=el('button',{type:'button',className:'s',textContent:'Modifier'}); b1.onclick=()=>edit(p);
    const b2=el('button',{type:'button',className:'s',textContent:'Supprimer'}); b2.onclick=()=>del(p);
    return el('div',{className:'item'}, p.photo_url?el('img',{src:p.photo_url,alt:''}):el('div',{className:'noimg'}),
      el('div',{className:'t'},el('b',{textContent:p.nom}),el('small',{textContent:info})), b1, b2);
  }));
  if(!shown.length) $('list').append(el('p',{textContent:items.length?'Aucun résultat.':'Aucun produit. Ajoutez le premier.'}));
}
async function load(){ items=await Store.list(); render(); }
async function enter(){ $('login').hidden=true; $('app').hidden=false; $('out').hidden=Store.demo; await load(); }
$('photo').onchange=()=>{ if(blob) URL.revokeObjectURL(blob); const f=$('photo').files[0]; blob=f&&URL.createObjectURL(f); preview(blob||current?.photo_url); };
$('q').oninput=render; $('cancel').onclick=reset;
$('f').onsubmit=async ev=>{
  ev.preventDefault();
  const p=current?{...current}:{};
  TEXT.forEach(k=>p[k]=$(k).value.trim());
  if(!p.nom) return say('Indiquez le nom du produit.');
  p.prix=$('prix').value===''?null:Number($('prix').value);
  p.disponible=$('disponible').checked; p.visible=$('visible').checked;
  $('ok').disabled=true; say('Enregistrement…');
  try{ await Store.save(p,$('photo').files[0]); reset(); await load(); say('Produit enregistré.'); }
  catch(e){ say(e.message); } finally{ $('ok').disabled=false; }
};
$('lf').onsubmit=async ev=>{ ev.preventDefault(); try{ await Store.login($('email').value,$('pass').value); $('pass').value=''; await enter(); }catch(e){ say(e.message); } };
$('out').onclick=async()=>{ await Store.logout(); location.reload(); };
(async()=>{ $('demo').hidden=!Store.demo; try{ if(await Store.isAdmin()) await enter(); else $('login').hidden=false; }catch(e){ $('login').hidden=false; say(e.message); } })();
</script></body></html>
